# D7 (diagnostic) — D6 retrieval (fixed chunks, dense + rerank + current filter + gate) with the keyword-RULES
# router, so routing, text-to-SQL and mixed answers can run before the 🧠 chunker/fusion exist.
name: D7-rules-router
chunker: {type: fixed, max_tokens: 500, overlap: 50}
retrieval: {dense: true, sparse: false, rerank: true, rerank_candidates: 30, rerank_threshold: 0.6370, rerank_threshold_mode: gate, k_final: 5, current_only: true}
routing: {router: rules}
