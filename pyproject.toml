[project]
name = "cleanair"
version = "0.1.0"
description = "Bilingual RAG + text-to-SQL assistant for Indian air-quality policy and data"
readme = "README.md"
authors = [
    { name = "DevVaradPatil", email = "varadapatil123@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.6",
    "litellm>=1.104.0",
    "numpy>=2.4.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "sqlglot>=30.21.0",
    "torch>=2.6.0",
    "transformers>=5.18.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import the top-level eval package
markers = ["integration: needs running services (Qdrant); run with `pytest -m integration`"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md"]  # keep ruff off the spec and docs

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# torch must come from the CUDA index (a plain PyPI wheel is CPU-only on Windows).
[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff.lint.per-file-ignores]
# few-shot JSON examples and SQL strings inside prompts read worse when wrapped
"src/cleanair/routing/router.py" = ["E501"]
"src/cleanair/sql/schema_context.py" = ["E501"]
